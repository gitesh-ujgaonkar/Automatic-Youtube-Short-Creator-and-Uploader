name: Daily Short Generator

on:
  schedule:
    - cron: '30 3 * * *' # 9:00 AM IST (3:30 AM UTC)
  workflow_dispatch: # Allows manual run button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions: # ADD THIS BLOCK
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Create Config Files
        run: |
          echo "$CLIENT_SECRET_JSON" > client_secret.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python master_pipeline.py
